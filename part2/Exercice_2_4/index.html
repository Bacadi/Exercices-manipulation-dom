<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Exercice 4</title>
</head>
<body>
  <form>
    <label for="password">Votre mot de passe : </label><input type="text" name="password" id="password" />
    <label for="confirmPassword">Confirmez : </label><input type="text" name="confirmPassword" id="confirmPassword" />
    <button type="button" name="button" >Vérification</button>
  </form>
</body>
<script>
  const mdp = document.getElementById('password');
  const confirmMdp = document.getElementById('confirmPassword');
  const verifBtn = document.getElementById('verif-btn');

  verifBtn.addEventListener('click', () => {
    const couleur = mdp.value === confirmMdp.value ? 'green' : 'red';
    mdp.style.border = `2px solid ${couleur}`;
    confirmMdp.style.border = `2px solid ${couleur}`;
  });
</script>
</html>
